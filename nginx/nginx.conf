# ---------- Web tier (part 2): single public entry point ----------
server {
    listen 80;

    # API calls -> application tier (the /api prefix is stripped)
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_read_timeout 120s;            # LLM answers can take a while
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else -> front-end server
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
