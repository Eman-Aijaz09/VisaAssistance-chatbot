<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visa Assistant — Test UI</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2f3a;
    --accent: #4f8cff;
    --text: #e8e9ec;
    --muted: #9aa0ac;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    max-width: 900px;
    margin-inline: auto;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 14px; }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 16px; margin-top: 0; }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 12px;
  }
  input, select {
    width: 100%;
    padding: 8px 10px;
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 16px;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
  }

  .card {
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--accent); }
  .card .country-badge {
    display: inline-block;
    font-size: 11px;
    background: #2a2f3a;
    color: var(--muted);
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 6px;
  }
  .card h3 { margin: 4px 0; font-size: 15px; }
  .card p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  .relaxed-banner {
    background: #3a2e10;
    border: 1px solid #6b5518;
    color: #e6c877;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .choice-buttons { display: flex; gap: 10px; margin-top: 12px; }

  .detail-block { font-size: 13px; line-height: 1.6; }
  .detail-block h4 { margin-bottom: 4px; margin-top: 16px; color: var(--accent); font-size: 13px; }
  .detail-block pre {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: inherit;
    margin: 0;
    color: var(--text);
  }

  .chat-log { max-height: 400px; overflow-y: auto; margin-bottom: 12px; }
  .msg { margin-bottom: 14px; }
  .msg.user { text-align: right; }
  .msg .bubble {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 10px;
    max-width: 85%;
    font-size: 14px;
    line-height: 1.5;
    text-align: left;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--accent); color: white; }
  .msg.assistant .bubble { background: #10131a; border: 1px solid var(--border); }
  .msg .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .back-link {
    display: inline-block;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .back-link:hover { color: var(--accent); }

  .loading { color: var(--muted); font-size: 13px; font-style: italic; }
  .error-box {
    background: #3a1010;
    border: 1px solid #6b1818;
    color: #e68a8a;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
  }

  #detailScreen, #chatScreen, #choiceScreen { display: none; }
</style>
</head>
<body>

<h1>Visa Assistant — Test UI</h1>
<div class="subtitle">Backend: <code id="apiBaseDisplay">http://127.0.0.1:8000</code></div>

<!-- ============ SCREEN 0: API BASE CONFIG ============ -->
<div class="panel">
  <label>API Base URL</label>
  <input id="apiBase" value="http://127.0.0.1:8000" onchange="document.getElementById('apiBaseDisplay').textContent = this.value">
</div>

<!-- ============ SCREEN 1: FORM ============ -->
<div class="panel" id="formScreen">
  <h2>Tell us about yourself</h2>
  <div class="hint">Leave anything blank if you're not sure — filters only apply when filled in.</div>

  <div class="row">
    <div>
      <label>Preferred country (optional)</label>
      <select id="f_country">
        <option value="">Any</option>
        <option value="Germany">Germany</option>
        <option value="USA">USA</option>
        <option value="France">France</option>
        <option value="Japan">Japan</option>
        <option value="Australia">Australia</option>
        <option value="Qatar">Qatar</option>
      </select>
    </div>
    <div>
      <label>Purpose</label>
      <select id="f_purpose">
        <option value="">Any</option>
        <option value="study">Study</option>
        <option value="work">Work</option>
        <option value="tourist">Tourist</option>
        <option value="family_reunion">Family Reunion</option>
        <option value="business">Business</option>
        <option value="permanent_residency">Permanent Residency</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <label>Education level</label>
      <select id="f_education">
        <option value="">Not sure</option>
        <option value="none">None</option>
        <option value="bachelor">Bachelor's</option>
        <option value="master">Master's</option>
        <option value="phd">PhD</option>
      </select>
    </div>
    <div>
      <label>Budget (approx, in your own currency)</label>
      <input id="f_budget" type="number" placeholder="e.g. 2000">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Language test (if any)</label>
      <input id="f_language_test" placeholder="e.g. IELTS">
    </div>
    <div>
      <label>Language score</label>
      <input id="f_language_score" placeholder="e.g. 7">
    </div>
  </div>

  <button onclick="submitForm()">Get Recommendations</button>
  <div id="formError"></div>
</div>

<!-- ============ SCREEN 2: RESULTS ============ -->
<div class="panel" id="resultsScreen" style="display:none;">
  <span class="back-link" onclick="showScreen('formScreen')">&larr; Edit my info</span>
  <h2>Recommended Pathways</h2>
  <div id="relaxedBanner"></div>
  <div id="resultsList"></div>
</div>

<!-- ============ SCREEN 3: CHOICE (details vs follow-up) ============ -->
<div class="panel" id="choiceScreen">
  <span class="back-link" onclick="showScreen('resultsScreen')">&larr; Back to results</span>
  <h2 id="choiceTitle"></h2>
  <p class="hint" id="choiceSubtitle"></p>
  <div class="choice-buttons">
    <button onclick="loadFullDetails()">See full details</button>
    <button class="secondary" onclick="startFollowUp()">Ask a follow-up question</button>
  </div>
</div>

<!-- ============ SCREEN 4: FULL DETAILS ============ -->
<div class="panel" id="detailScreen">
  <span class="back-link" id="detailBackLink">&larr; Back</span>
  <h2 id="detailTitle"></h2>
  <div id="detailBody" class="detail-block"></div>
  <button class="secondary" onclick="startFollowUp()">Ask a follow-up instead</button>
</div>

<!-- ============ SCREEN 5: FOLLOW-UP CHAT ============ -->
<div class="panel" id="chatScreen">
  <span class="back-link" id="chatBackLink">&larr; Back</span>
  <h2>Ask about: <span id="chatContextLabel"></span></h2>
  <div class="chat-log" id="chatLog"></div>
  <div class="row">
    <div style="flex:3">
      <input id="chatInput" placeholder="e.g. what documents do I need?" onkeydown="if(event.key==='Enter') sendFollowUp()">
    </div>
    <div style="flex:1">
      <button onclick="sendFollowUp()" style="width:100%; margin-top:0;">Send</button>
    </div>
  </div>
</div>

<script>
let currentSelection = null; // { id, country, visa_type, title }

function apiBase() {
  return document.getElementById('apiBase').value.replace(/\/$/, '');
}

function showScreen(id) {
  ['formScreen','resultsScreen','choiceScreen','detailScreen','chatScreen'].forEach(s => {
    document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
  });
}

// ---------------- FORM SUBMIT -> /recommend ----------------
async function submitForm() {
  const body = {
    countries: document.getElementById('f_country').value ? [document.getElementById('f_country').value] : null,
    purpose: document.getElementById('f_purpose').value || null,
    education_level: document.getElementById('f_education').value || null,
    language_test: document.getElementById('f_language_test').value || null,
    language_score: document.getElementById('f_language_score').value || null,
    budget: document.getElementById('f_budget').value ? parseFloat(document.getElementById('f_budget').value) : null,
  };

  document.getElementById('formError').innerHTML = '<div class="loading">Loading recommendations...</div>';

  try {
    const res = await fetch(`${apiBase()}/recommend`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    document.getElementById('formError').innerHTML = '';
    renderResults(data);
    showScreen('resultsScreen');
  } catch (e) {
    document.getElementById('formError').innerHTML = `<div class="error-box">Request failed: ${e.message}</div>`;
  }
}

function renderResults(data) {
  const banner = document.getElementById('relaxedBanner');
  banner.innerHTML = data.relaxed && data.message
    ? `<div class="relaxed-banner">${escapeHtml(data.message)}</div>`
    : '';

  const list = document.getElementById('resultsList');
  if (!data.results || data.results.length === 0) {
    list.innerHTML = '<p class="hint">No matching visas found. Try loosening your filters.</p>';
    return;
  }

  list.innerHTML = data.results.map(r => `
    <div class="card" onclick='openChoice(${JSON.stringify(r).replace(/'/g, "&#39;")})'>
      <span class="country-badge">${escapeHtml(r.country)}</span>
      <h3>${escapeHtml(r.title)}</h3>
      <p>${escapeHtml(r.summary)}</p>
    </div>
  `).join('');
}

// ---------------- CHOICE SCREEN ----------------
function openChoice(item) {
  currentSelection = item;
  document.getElementById('choiceTitle').textContent = item.title;
  document.getElementById('choiceSubtitle').textContent = `${item.country} — ${item.visa_type}`;
  showScreen('choiceScreen');
}

// ---------------- FULL DETAILS -> /visa-detail/{id} ----------------
async function loadFullDetails() {
  document.getElementById('detailBackLink').onclick = () => showScreen('choiceScreen');
  document.getElementById('detailTitle').textContent = currentSelection.title;
  const body = document.getElementById('detailBody');
  body.innerHTML = '<div class="loading">Loading full details...</div>';
  showScreen('detailScreen');

  try {
    const res = await fetch(`${apiBase()}/visa-detail/${currentSelection.id}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const row = await res.json();
    body.innerHTML = renderDetailFields(row);
  } catch (e) {
    body.innerHTML = `<div class="error-box">Could not load details: ${e.message}<br><br>
      (Expected endpoint: GET /visa-detail/{id} — make sure it's implemented on the backend.)</div>`;
  }
}

function renderDetailFields(row) {
  const fields = [
    ['Purpose', row.purpose], ['Topic', row.topic], ['Visa Type', row.visa_type],
    ['Summary', row.summary], ['Eligibility', row.eligibility], ['Required Documents', row.required_documents],
    ['Application Process', row.application_process], ['Processing Time', row.processing_time],
    ['Application Fee', row.application_fee], ['Validity', row.validity],
    ['Important Notes', row.important_notes], ['Official Links', row.official_links],
    ['Source URL', row.source_url],
  ];
  return fields
    .filter(([, v]) => v !== null && v !== undefined && v !== '')
    .map(([label, v]) => `<h4>${label}</h4><pre>${escapeHtml(formatVal(v))}</pre>`)
    .join('');
}

function formatVal(v) {
  if (typeof v === 'string') {
    try {
      const parsed = JSON.parse(v);
      if (Array.isArray(parsed)) return parsed.map(x => `• ${x}`).join('\n');
      if (typeof parsed === 'object') return JSON.stringify(parsed, null, 2);
    } catch (e) { /* not JSON, plain string */ }
    return v;
  }
  return JSON.stringify(v, null, 2);
}

// ---------------- FOLLOW-UP CHAT -> /ask ----------------
function startFollowUp() {
  document.getElementById('chatBackLink').onclick = () => showScreen('choiceScreen');
  document.getElementById('chatContextLabel').textContent = `${currentSelection.country} — ${currentSelection.title}`;
  document.getElementById('chatLog').innerHTML = '';
  document.getElementById('chatInput').value = '';
  showScreen('chatScreen');
}

async function sendFollowUp() {
  const input = document.getElementById('chatInput');
  const query = input.value.trim();
  if (!query) return;
  input.value = '';

  appendChatMessage('user', query);
  const loadingId = appendChatMessage('assistant', 'Thinking...', true);

  try {
    const res = await fetch(`${apiBase()}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query,
        context_country: currentSelection.country,
        context_visa_type: currentSelection.visa_type,
      }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    replaceChatMessage(loadingId, data.answer, `category: ${data.category}`);
  } catch (e) {
    replaceChatMessage(loadingId, `Request failed: ${e.message}`, '');
  }
}

let chatMsgCounter = 0;
function appendChatMessage(role, text, isLoading = false) {
  const id = `msg-${chatMsgCounter++}`;
  const log = document.getElementById('chatLog');
  log.insertAdjacentHTML('beforeend', `
    <div class="msg ${role}" id="${id}">
      <div class="bubble">${escapeHtml(text)}</div>
      <div class="meta"></div>
    </div>
  `);
  log.scrollTop = log.scrollHeight;
  return id;
}

function replaceChatMessage(id, text, meta) {
  const el = document.getElementById(id);
  el.querySelector('.bubble').textContent = text;
  el.querySelector('.meta').textContent = meta;
  document.getElementById('chatLog').scrollTop = document.getElementById('chatLog').scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
</script>

</body>
</html>
